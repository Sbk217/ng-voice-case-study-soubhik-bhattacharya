apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: casestudy
  labels:
    app: mysql
spec:
  clusterIP: None              # headles with DNS per pod (mysql-0.mysql.casestudy.svc) so that webserver replica can contact directly
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306