apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-smoke
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-smoke
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [ "sh", "-c", "echo hello-ebs > /data/test.txt && sleep 3600" ]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ebs-smoke