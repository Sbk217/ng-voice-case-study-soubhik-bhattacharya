replicas: 3
image:
  repository: nginx/nginx-unprivileged   # runs as non-root (uid 101), listens on 8080
  tag: "1.31.9-alpine3.24"                         # pin an exact tag from Docker Hub
initImage: busybox:1.37
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

ingress:
  enabled: true
  allowedCidrs: ["80.88.28.130/32"] #personal ip address