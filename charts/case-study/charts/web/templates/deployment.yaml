apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "web.labels" . | nindent 8 }}
      annotations:
        # restart pods automatically when the ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }} # changing default.conf and running helm upgrade automatically rolls the pods. Without it, subPath mounts never pick up ConfigMap changes.
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: render-page
          image: {{ .Values.initImage }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          command: [ "sh", "-c" ]
          args:
            - |
              set -e
              SUFFIX=$(printf '%s' "$POD_NAME" | tail -c 5)
              sed -e "s/__POD_IP__/${POD_IP}/" \
                  -e "s/__SERVING_HOST__/Host-${SUFFIX}/" \
                  /config/index.html.tpl > /html/index.html
              cat /html/index.html
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: html,   mountPath: /html }
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: html,   mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tmp,    mountPath: /tmp }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - { name: config, configMap: { name: web-config } }
        - { name: html,   emptyDir: { } }
        - { name: tmp,    emptyDir: { } }