apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: {{- include "mysql.labels" . | nindent 4 }}
spec:
  clusterIP: None              # headless with DNS per pod (mysql-0.mysql.casestudy.svc) so that webserver replica can contact directly
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306