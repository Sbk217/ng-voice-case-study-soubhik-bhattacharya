{{- $existing := lookup "v1" "Secret" .Release.Namespace "mysql-auth" }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-auth
  labels: {{- include "mysql.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  root-password: {{ index $existing.data "root-password" }}
  replication-password: {{ index $existing.data "replication-password" }}
  {{- else }}
  root-password: {{ randAlphaNum 24 | b64enc }}
  replication-password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}