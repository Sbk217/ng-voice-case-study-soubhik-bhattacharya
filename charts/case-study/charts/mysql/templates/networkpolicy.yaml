apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-ingress
  labels: {{- include "mysql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mysql.selectorLabels" . | nindent 6 }}
  policyTypes: [ "Ingress" ]          # selecting the pods = all other ingress denied
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedApps }}
        - podSelector:
            matchLabels:
              app: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3306