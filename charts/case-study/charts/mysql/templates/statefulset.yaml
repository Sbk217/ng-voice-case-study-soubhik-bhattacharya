{{- $root := . }}
{{- $primary := "" }}
{{- range .Values.members }}
  {{ if eq .role "primary" }}
    {{ $primary = .name }}
    {{ end }}
{{ end }}

{{- range $i, $m := .Values.members }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $m.name }}
  labels: {{- include "mysql.labels" $root | nindent 4 }}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "mysql.selectorLabels" $root | nindent 6 }}
      mysql-member: {{ $m.name }}
  template:
    metadata:
      labels:
        {{- include "mysql.labels" $root | nindent 8 }}
        mysql-member: {{ $m.name }}
        mysql-role: {{ $m.role }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: casestudy.io/db-node
                    operator: In
                    values: {{- toYaml $m.nodes | nindent 22 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: init-mysql
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
          command: [ "bash", "-c" ]
          args:
            - |
              set -ex
              printf '[mysqld]\nserver-id=%d\n' {{ add 100 $i }} > /mnt/conf.d/server-id.cnf
              if [ "{{ $m.role }}" = "primary" ]; then
                cp /mnt/config-map/primary.cnf     /mnt/conf.d/
                cp /mnt/config-map/primary-init.sh /mnt/initdb/
              else
                cp /mnt/config-map/replica.cnf     /mnt/conf.d/
                cp /mnt/config-map/replica-init.sh /mnt/initdb/
              fi
          volumeMounts:
            - { name: conf,       mountPath: /mnt/conf.d }
            - { name: initdb,     mountPath: /mnt/initdb }
            - { name: config-map, mountPath: /mnt/config-map }
      containers:
        - name: mysql
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-auth, key: root-password } }
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-auth, key: replication-password } }
            - name: MYSQL_SOURCE_HOST #also used in the replica-init.sh script
              value: "{{ $primary }}-0.mysql"
          volumeMounts:
            - { name: data,   mountPath: /var/lib/mysql }
            - { name: conf,   mountPath: /etc/mysql/conf.d }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          resources: {{- toYaml $root.Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: [ "sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -e 'SELECT 1'" ]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [ "sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot" ]
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - { name: conf,       emptyDir: { } }  # emptyDir: empty scratch space that is initialized when the Pod is assigned to a node, and is deleted when the Pod is removed from that node.
        - { name: initdb,     emptyDir: { } }
        - { name: config-map, configMap: { name: mysql-config } }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ $root.Values.storage.className }}
        resources:
          requests:
            storage: {{ $root.Values.storage.size }}
{{- end }}